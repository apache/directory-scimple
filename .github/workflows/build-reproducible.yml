name: Build Reproducibility Check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or SHA to checkout
        default: 'develop'
        type: string

env:
  MAVEN_ARGS: -V -B --no-transfer-progress

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [21]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Java ${{ matrix.java }}-zulu
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 #v5.2.0
        with:
          java-version: ${{ matrix.java }}
          distribution: zulu
          cache: '' # disabled

      - name: Running Maven
        run: |
          ./mvnw install  \
            -Ddevelocity.cache.local.enabled=false \
            -Ddevelocity.cache.remote.enabled=false
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DIRECTORY_DEVELOCITY_ACCESS_KEY }}

      - name: Running Maven again to check reproducibility
        run: |
          ./mvnw clean verify artifact:compare  \
            -Ddevelocity.cache.local.enabled=false \
            -Ddevelocity.cache.remote.enabled=false
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DIRECTORY_DEVELOCITY_ACCESS_KEY }}

      - name: Upload Build Info
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #v6.0.0
        with:
          name: Artifact BuildInfo
          path: target/scimple-*.buildinfo

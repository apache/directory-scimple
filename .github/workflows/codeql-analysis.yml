name: "CodeQL"

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  schedule:
    - cron: '0 1 */3 * *'

env:
  MAVEN_ARGS: -V -B --no-transfer-progress

jobs:
  analyze:
    name: Analyze
    runs-on: 'ubuntu-latest'
    permissions:
      # required for all workflows
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]
        javaVersion: [ '17' ]
        javaDistribution: [ 'zulu' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

      - name: Set up Java 17-zulu
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 #v5.2.0
        with:
          java-version: ${{ matrix.javaVersion }}
          distribution: ${{ matrix.javaDistribution }}
          cache: maven

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b1bff81932f5cdfc8695c7752dcee935dcd061c8 #v4.33.0
        with:
          languages: ${{ matrix.language }}

      - name: Maven Build
        run: |
          ./mvnw verify pmd:aggregate-pmd -Pci \
            -Ddevelocity.cache.local.enabled=false \
            -Ddevelocity.cache.remote.enabled=false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b1bff81932f5cdfc8695c7752dcee935dcd061c8 #v4.33.0
        with:
          category: "/language:${{matrix.language}}"

      - name: Upload PMD Analysis
        uses: github/codeql-action/upload-sarif@b1bff81932f5cdfc8695c7752dcee935dcd061c8 #v4.33.0
        with:
          sarif_file: target/pmd.sarif.json

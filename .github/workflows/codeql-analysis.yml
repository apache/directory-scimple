name: "CodeQL"

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  schedule:
    - cron: '0 1 */3 * *'

env:
  MAVEN_ARGS: -V -B --no-transfer-progress

jobs:
  analyze:
    name: Analyze
    runs-on: 'ubuntu-latest'
    permissions:
      # required for all workflows
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]
        javaVersion: [ '17' ]
        javaDistribution: [ 'zulu' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1

      - name: Set up Java 17-zulu
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e #v5.1.0
        with:
          java-version: ${{ matrix.javaVersion }}
          distribution: ${{ matrix.javaDistribution }}
          cache: maven

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@fe4161a26a8629af62121b670040955b330f9af2 #v4.31.6
        with:
          languages: ${{ matrix.language }}

      - name: Maven Build
        run: |
          ./mvnw verify pmd:aggregate-pmd -Pci \
            -Ddevelocity.cache.local.enabled=false \
            -Ddevelocity.cache.remote.enabled=false

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@fe4161a26a8629af62121b670040955b330f9af2 #v4.31.6
        with:
          category: "/language:${{matrix.language}}"

      - name: Upload PMD Analysis
        uses: github/codeql-action/upload-sarif@fe4161a26a8629af62121b670040955b330f9af2 #v4.31.6
        with:
          sarif_file: target/pmd.sarif.json

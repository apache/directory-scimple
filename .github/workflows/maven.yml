name: Run Maven

on:
  workflow_call:
    inputs:
      name:
        type: string
        default: "Running Maven"
      jobs_path:
        type: string
        required: true
        description: "The composite job name, e.g. rat / maven, or build (21) / maven"
        # TODO: it _should_ be possible to remove this and get the value from the context
      mvn:
        required: true
        type: string
      java-version:
        required: true
        type: string
      java-distribution:
        required: true
        type: string

env:
  MAVEN_ARGS: -V -B --no-transfer-progress

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java ${{ inputs.java-version }}-${{ inputs.java-distribution }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: maven

      - name: Setup Build Scan PR Comment and Summary
        uses: gradle/develocity-actions/maven-setup@v1.1
        with:
          job-name: ${{ inputs.name }}

      - name: Running Maven
        id: mvnBuild
        run: ./mvnw ${{ inputs.mvn }}
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.GE_ACCESS_TOKEN }}
